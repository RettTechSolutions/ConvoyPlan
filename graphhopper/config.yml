# Referenz-Konfiguration – wird im Container durch entrypoint.sh dynamisch generiert.
# Diese Datei wird NICHT direkt verwendet; Pfade/Profile werden aus Umgebungsvariablen
# abgeleitet (OSM_DOWNLOAD_URL, OSM_FILENAME).
#
# Für direkten Einsatz ohne Docker:
#   java -jar graphhopper.jar server config.yml

graphhopper:
  datareader.file: /data/osm/dach-latest.osm.pbf
  graph.location: /data/graph

  # Vom Backend benötigte Encoded Values: road_class + max_speed (Routen-Details
  # für die Fahrzeitberechnung, Custom Model der Straßenpräferenzen) und
  # max_height (Höhenbeschränkung der Fahrzeuge).
  graph.encoded_values: car_access, car_average_speed, road_class, max_speed, max_height

  # Abbiegeverbote in beiden Profilen, keine CH — Begruendung in entrypoint.sh.
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]
    - name: truck
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]

server:
  application_connector:
    type: http
    port: 8989
  admin_connector:
    type: http
    port: 8990
