<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			(function() {
				try {
					var t = localStorage.getItem('convoyplan-theme');
					if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				} catch (_) {}
			})();
		</script>
		<style>
			*, *::before, *::after { box-sizing: border-box; }
			html, body {
				margin: 0;
				padding: 0;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				/* Kill stray horizontal scroll caused by overflowing children on small viewports.
				   `clip` is used in preference to `hidden` because on iOS Safari, `overflow-x: hidden`
				   on the document root blocks touch-driven horizontal scrolling inside descendant
				   containers (admin tab-bar, wide tables). `clip` clips the same way without
				   establishing a scroll container, so inner overflow-x: auto stays interactive.
				   Older browsers that don't know `clip` keep the `hidden` fallback. */
				overflow-x: hidden;
				overflow-x: clip;
				/* Disable iOS overscroll/bounce that exposes content behind fixed bars. */
				overscroll-behavior: none;
			}

			:root {
				/* Typography scale */
				--text-xs:   .72rem;
				--text-sm:   .82rem;
				--text-base: .92rem;
				--text-lg:   1.05rem;

				/* Branding vars (overridden at runtime by /api/branding) */
				--color-primary: #E23D28;
				--color-primary-hover: #C23020;
				--color-accent: #3498db;
				--color-bg: #f5f3ee;
				--color-surface: #ffffff;
				--color-nav-bg: #2c3e50;
				--color-nav-text: #ecf0f1;
				--color-text: #2c3e50;
				--color-text-muted: #7f8c8d;
			}

			[data-theme="dark"] {
				--bg:         #0f1419;
				--surface-1:  #161f2e;
				--surface-2:  #1e2d3d;
				--sidebar-bg: #161f2e;
				--border:     rgba(255, 255, 255, .1);
				--text-1:     #e8edf2;
				--text-2:     rgba(255, 255, 255, .55);
				--text-muted: rgba(255, 255, 255, .32);
				--shadow:     none;
			}

			[data-theme="light"] {
				--bg:         #f0f2f5;
				--surface-1:  #ffffff;
				--surface-2:  #f8f9fa;
				--sidebar-bg: #ffffff;
				--border:     #dde1e7;
				--text-1:     #1a2332;
				--text-2:     #4a5568;
				--text-muted: #9aa3b0;
				--shadow:     0 1px 3px rgba(0, 0, 0, .08);
			}
		</style>
		%sveltekit.head%
	</head>
	<!-- preload "tap" statt "hover": Hover-Preloads laden CSS/JS von Routen, die
	     nie besucht werden, und erzeugen "resource was preloaded but not used"-
	     Warnungen in der Konsole. Bei "tap" wird erst bei pointerdown geladen. -->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
