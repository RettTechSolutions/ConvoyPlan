services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: marschplan
      POSTGRES_PASSWORD: marschplan
      POSTGRES_DB: marschplan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marschplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://marschplan:marschplan@db:5432/marschplan
      JWT_SECRET: changeme-in-production
      GRAPHHOPPER_URL: http://graphhopper:8989
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      graphhopper:
        condition: service_healthy

  graphhopper:
    build:
      context: ./graphhopper
      args:
        GH_VERSION: "9.1"
    environment:
      # Geofabrik-URL der gewünschten Region:
      #   Deutschland (Standard, ~4 GB): https://download.geofabrik.de/europe/germany-latest.osm.pbf
      #   Bayern      (~1 GB):           https://download.geofabrik.de/europe/germany/bayern-latest.osm.pbf
      #   Berlin      (~30 MB, Tests):   https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
      OSM_DOWNLOAD_URL: https://download.geofabrik.de/europe/germany-latest.osm.pbf
      OSM_FILENAME: germany-latest.osm.pbf
      JAVA_OPTS: -Xmx2g -Xms512m -XX:+UseG1GC
    volumes:
      - osm_data:/data/osm      # OSM-PBF (wird beim ersten Start automatisch geladen)
      - gh_graph:/data/graph    # Kompilierter Graph-Cache (persistiert zwischen Neustarts)
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 15s
      timeout: 10s
      retries: 40          # bis zu ~10 Minuten für erstmaligen Graph-Import
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  osm_data:
  gh_graph:
