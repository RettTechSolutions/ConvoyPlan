services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convoyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-convoyplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convoyplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/backend:latest}
    restart: unless-stopped
    # Robust boot: runs migrations then uvicorn, and fails closed with a clear
    # diagnostic if this image is older than the DB schema (see
    # backend/docker-entrypoint.sh). The healthcheck below then reports the
    # container unhealthy, which lets the updater auto-roll-back a bad deploy.
    command: ["/app/docker-entrypoint.sh"]
    healthcheck:
      # Uses the stdlib (no curl in the slim image). Hits the internal /health
      # route so Docker/updater can tell a crash-looping backend from a healthy
      # one instead of treating "container started" as success.
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:${BACKEND_PORT:-8000}/health", timeout=4).status==200 else 1)
      interval: 15s
      timeout: 6s
      retries: 5
      # Generous grace period so slow migrations on first boot don't count as
      # failures before uvicorn is even listening.
      start_period: 90s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-convoyplan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}@db:5432/${POSTGRES_DB:-convoyplan}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      APP_ENV: ${APP_ENV:-production}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PASSWORD_BREACH_CHECK_ENABLED: ${PASSWORD_BREACH_CHECK_ENABLED:-true}
      # Hourly per-caller budgets for the endpoints that spend a metered
      # upstream quota (HERE/TomTom, GraphHopper). Demo sessions get the
      # smaller budget — see backend/app/api/quota.py.
      QUOTA_ROUTING_PER_HOUR: ${QUOTA_ROUTING_PER_HOUR:-240}
      QUOTA_ROUTING_DEMO_PER_HOUR: ${QUOTA_ROUTING_DEMO_PER_HOUR:-40}
      QUOTA_GEOCODE_PER_HOUR: ${QUOTA_GEOCODE_PER_HOUR:-600}
      QUOTA_GEOCODE_DEMO_PER_HOUR: ${QUOTA_GEOCODE_DEMO_PER_HOUR:-100}
      QUOTA_TRAFFIC_PER_HOUR: ${QUOTA_TRAFFIC_PER_HOUR:-600}
      QUOTA_TRAFFIC_DEMO_PER_HOUR: ${QUOTA_TRAFFIC_DEMO_PER_HOUR:-100}
      GRAPHHOPPER_URL: http://graphhopper:8989
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      LICENSE_KEY: ${LICENSE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-RettTechSolutions/ConvoyPlan}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATE_MODE: ${UPDATE_MODE:-auto}
      UPDATE_NOTIFY_INTERVAL: ${UPDATE_NOTIFY_INTERVAL:-1800}
      UPDATE_NOTIFY_ON_AUTO: ${UPDATE_NOTIFY_ON_AUTO:-false}
      APP_BASE_URL: https://${DOMAIN:-localhost}
      # Live-Verkehrslage (HERE/TomTom) — alternativ im Admin-Panel setzbar.
      HERE_TRAFFIC_API_KEY: ${HERE_TRAFFIC_API_KEY:-}
      TOMTOM_TRAFFIC_API_KEY: ${TOMTOM_TRAFFIC_API_KEY:-}
      TRAFFIC_FLOW_PROVIDER: ${TRAFFIC_FLOW_PROVIDER:-}
      # Offene Baustellenfeeds (Open Data + mobilithek/DATEX II). Standard =
      # BW + Berlin; per OPENDATA_TRAFFIC_FEEDS überschreiben, um z. B.
      # datex2|<broker-url> für weitere Bundesländer oder für Österreich
      # (ASFINAG) und die Schweiz (opentransportdata.swiss) zu ergänzen.
      # Zugangsdaten dieser Feeds gehören in OPENDATA_TRAFFIC_API_KEYS, damit
      # die Feed-Liste selbst frei von Geheimnissen bleibt.
      OPENDATA_TRAFFIC_ENABLED: ${OPENDATA_TRAFFIC_ENABLED:-true}
      OPENDATA_TRAFFIC_FEEDS: ${OPENDATA_TRAFFIC_FEEDS:-mobidata_bw|https://api.mobidata-bw.de/datasets/traffic/roadworks/roadworks_geojson.json,berlin_viz|https://api.viz.berlin.de/daten/baustellen_sperrungen_viz.json}
      OPENDATA_TRAFFIC_API_KEYS: ${OPENDATA_TRAFFIC_API_KEYS:-}
      OPENDATA_TRAFFIC_CLIENT_CERT: ${OPENDATA_TRAFFIC_CLIENT_CERT:-}
      OPENDATA_TRAFFIC_CA_CERT: ${OPENDATA_TRAFFIC_CA_CERT:-}
      # Systemübersicht: Hardware-/Container-/Nutzungskennzahlen. Der
      # Container-Zustand kommt über den lesenden dockerproxy-Sidecar — das
      # Backend bekommt bewusst KEINEN Docker-Socket.
      SYSTEM_METRICS_ENABLED: ${SYSTEM_METRICS_ENABLED:-true}
      SYSTEM_METRICS_INTERVAL: ${SYSTEM_METRICS_INTERVAL:-300}
      SYSTEM_METRICS_RETENTION_DAYS: ${SYSTEM_METRICS_RETENTION_DAYS:-90}
      SYSTEM_METRICS_DAILY_RETENTION_DAYS: ${SYSTEM_METRICS_DAILY_RETENTION_DAYS:-1095}
      SYSTEM_METRICS_DISK_PATHS: ${SYSTEM_METRICS_DISK_PATHS:-/,/uploads,/update_status}
      DOCKER_METRICS_ENABLED: ${DOCKER_METRICS_ENABLED:-true}
      DOCKER_API_URL: ${DOCKER_API_URL:-http://dockerproxy:2375}
      DOCKER_STATS_ENABLED: ${DOCKER_STATS_ENABLED:-true}
    volumes:
      - cert_uploads:/certs
      - logo_uploads:/uploads
      - update_status:/update_status
      # Zertifikate für per mTLS geschützte Feeds (mobilithek-Broker). Dateien
      # auf dem Host in ./secrets ablegen; im Container unter /secrets erreichbar.
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      graphhopper:
        condition: service_started

  retention:
    image: ${BACKEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/backend:latest}
    restart: unless-stopped
    # Periodic data-retention purge (DSGVO Art. 5(1)(e)). Reuses the backend image.
    command: sh -c "while true; do python -m app.jobs.retention || true; sleep ${RETENTION_INTERVAL:-3600}; done"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-convoyplan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}@db:5432/${POSTGRES_DB:-convoyplan}
      APP_ENV: ${APP_ENV:-production}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_POSITIONS_HOURS: ${RETENTION_POSITIONS_HOURS:-24}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      RETENTION_SHARE_LINKS_DAYS: ${RETENTION_SHARE_LINKS_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy

  dockerproxy:
    image: ${DOCKER_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:0.3.0}
    restart: unless-stopped
    # Liest den Docker-Socket und gibt davon NUR lesende Endpunkte frei, die die
    # Systemübersicht braucht (Container-Zustand, Health, Stats). Der Socket
    # selbst bleibt aus dem Backend heraus, denn Zugriff darauf ist faktisch
    # Root auf dem Host — ein von außen erreichbarer Container darf ihn nicht
    # haben. POST ist aus (Standard), es lässt sich also nichts starten,
    # stoppen oder erzeugen.
    environment:
      CONTAINERS: 1     # /containers/json + /containers/<id>/stats
      INFO: 1           # /info — Engine-Kennzahlen
      VERSION: 1        # /version
      POST: 0           # keine schreibenden Aufrufe
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # Nicht nach außen veröffentlicht — nur im Compose-Netz erreichbar.
    expose:
      - "2375"

  graphhopper:
    image: ${GRAPHHOPPER_IMAGE:-ghcr.io/retttechsolutions/convoyplan/graphhopper:latest}
    restart: unless-stopped
    environment:
      OSM_DOWNLOAD_URL: ${OSM_DOWNLOAD_URL:-https://download.geofabrik.de/europe/dach-latest.osm.pbf}
      OSM_FILENAME: ${OSM_FILENAME:-dach-latest.osm.pbf}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx8g -Xms1g -XX:+UseG1GC}
    volumes:
      - osm_data:/data/osm
      - gh_graph:/data/graph
    ports:
      - "127.0.0.1:${GH_PORT:-8989}:8989"
    healthcheck:
      # Beim ersten Start (und nach jedem Regionswechsel) baut GraphHopper den
      # Graphen, bevor /health antwortet: für DACH 60-120 Min. Die Toleranz von
      # 360 x 30 s = 3 h liegt bewusst darüber, damit ein langsamer Datenträger
      # den Container nicht mitten im Import als "unhealthy" markiert.
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 360
      start_period: 120s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/frontend:latest}
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:-3000}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-false}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    volumes:
      # Default to the repo-relative entrypoint so a plain `git clone` + `docker
      # compose up` works; the installer overrides this with an absolute path.
      - ${CADDY_ENTRYPOINT_PATH:-./caddy/entrypoint.sh}:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
      - cert_uploads:/certs:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend

  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/retttechsolutions/convoyplan/updater:latest}
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-convoyplan}
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-300}"
      # STACK_FILE_PATH: absoluter HOST-Pfad zu dieser Compose-Datei.
      # Wird vom Installer automatisch gesetzt. Fehlt er, erkennt der Updater
      # den Pfad selbst über Docker-Labels und heilt sich eigenständig.
      STACK_FILE_PATH: ${STACK_FILE_PATH:-}
      # Absoluter HOST-Pfad zum Caddy-Entrypoint-Skript (caddy/entrypoint.sh).
      # Wird vom Installer gesetzt und per Volume in den Caddy-Container gemountet.
      CADDY_ENTRYPOINT_PATH: ${CADDY_ENTRYPOINT_PATH:-}
      # Alle Service-Variablen werden durchgereicht, damit `docker compose up`
      # innerhalb des Updater-Containers dieselben Werte wie beim Erststart hat.
      POSTGRES_USER: ${POSTGRES_USER:-convoyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-convoyplan}
      DB_PORT: ${DB_PORT:-5432}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      APP_ENV: ${APP_ENV:-production}
      LICENSE_KEY: ${LICENSE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-RettTechSolutions/ConvoyPlan}
      DOMAIN: ${DOMAIN:-localhost}
      APP_BASE_URL: https://${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      GH_PORT: ${GH_PORT:-8989}
      OSM_DOWNLOAD_URL: ${OSM_DOWNLOAD_URL:-https://download.geofabrik.de/europe/dach-latest.osm.pbf}
      OSM_FILENAME: ${OSM_FILENAME:-dach-latest.osm.pbf}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx8g -Xms1g -XX:+UseG1GC}
      BACKEND_IMAGE: ${BACKEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/backend:latest}
      FRONTEND_IMAGE: ${FRONTEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/frontend:latest}
      GRAPHHOPPER_IMAGE: ${GRAPHHOPPER_IMAGE:-ghcr.io/retttechsolutions/convoyplan/graphhopper:latest}
      UPDATER_IMAGE: ${UPDATER_IMAGE:-ghcr.io/retttechsolutions/convoyplan/updater:latest}
      DOCKER_PROXY_IMAGE: ${DOCKER_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:0.3.0}
      DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      SYSTEM_METRICS_ENABLED: ${SYSTEM_METRICS_ENABLED:-true}
      SYSTEM_METRICS_INTERVAL: ${SYSTEM_METRICS_INTERVAL:-300}
      SYSTEM_METRICS_RETENTION_DAYS: ${SYSTEM_METRICS_RETENTION_DAYS:-90}
      SYSTEM_METRICS_DAILY_RETENTION_DAYS: ${SYSTEM_METRICS_DAILY_RETENTION_DAYS:-1095}
      SYSTEM_METRICS_DISK_PATHS: ${SYSTEM_METRICS_DISK_PATHS:-/,/uploads,/update_status}
      DOCKER_METRICS_ENABLED: ${DOCKER_METRICS_ENABLED:-true}
      DOCKER_API_URL: ${DOCKER_API_URL:-http://dockerproxy:2375}
      DOCKER_STATS_ENABLED: ${DOCKER_STATS_ENABLED:-true}
    entrypoint: ["/bin/bash", "/update-images.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - update_status:/update_status
      # Wenn STACK_FILE_PATH gesetzt → richtige Datei gemountet.
      # Wenn leer (Altinstallation) → /dev/null (leere Datei); Updater erkennt
      # das und lädt die Compose-Datei selbst via Docker-Labels nach.
      # NOT read-only: Updater schreibt nach jedem Update die aktualisierte
      # Stack-Datei zurück, damit neue Env-Vars / Image-Refs übernommen werden.
      - ${STACK_FILE_PATH:-/dev/null}:/stack/docker-compose.yml
    depends_on:
      - backend

volumes:
  postgres_data:
  osm_data:
  gh_graph:
  caddy_data:
  caddy_config:
  cert_uploads:
  logo_uploads:
  update_status:
