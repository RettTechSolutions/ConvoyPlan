services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: marschplan
      POSTGRES_PASSWORD: marschplan
      POSTGRES_DB: marschplan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marschplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://marschplan:marschplan@db:5432/marschplan
      JWT_SECRET: changeme-in-production
      GRAPHHOPPER_URL: http://graphhopper:8989
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  graphhopper:
    image: israelhikingmap/graphhopper:latest
    environment:
      - JAVA_OPTS=-Xmx1g -Xms512m
    volumes:
      - ./graphhopper:/data
      - graphhopper_cache:/graphhopper/graph-cache
    ports:
      - "8989:8989"

volumes:
  postgres_data:
  graphhopper_cache:
