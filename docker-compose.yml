services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: convoyplan
      POSTGRES_PASSWORD: convoyplan
      POSTGRES_DB: convoyplan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoyplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://convoyplan:convoyplan@db:5432/convoyplan
      JWT_SECRET: changeme-in-production
      GRAPHHOPPER_URL: http://graphhopper:8989
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-RettTechSolutions/ConvoyPlan}
    volumes:
      - cert_uploads:/certs
      - logo_uploads:/uploads
      - update_status:/update_status
    depends_on:
      db:
        condition: service_healthy
      graphhopper:
        condition: service_healthy

  graphhopper:
    build:
      context: ./graphhopper
      args:
        GH_VERSION: "9.1"
    environment:
      # Geofabrik-URL der gewünschten Region:
      #   Deutschland (Standard, ~4 GB): https://download.geofabrik.de/europe/germany-latest.osm.pbf
      #   Bayern      (~1 GB):           https://download.geofabrik.de/europe/germany/bayern-latest.osm.pbf
      #   Berlin      (~30 MB, Tests):   https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
      OSM_DOWNLOAD_URL: https://download.geofabrik.de/europe/germany-latest.osm.pbf
      OSM_FILENAME: germany-latest.osm.pbf
      JAVA_OPTS: -Xmx2g -Xms512m -XX:+UseG1GC
    volumes:
      - osm_data:/data/osm      # OSM-PBF (wird beim ersten Start automatisch geladen)
      - gh_graph:/data/graph    # Kompilierter Graph-Cache (persistiert zwischen Neustarts)
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 15s
      timeout: 10s
      retries: 40          # bis zu ~10 Minuten für erstmaligen Graph-Import
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  caddy:
    # Admin API (:2019) is NOT exposed to the host — only reachable on the internal Docker network.
    # This is required for the backend to live-reload Caddy config via the setup wizard.
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-}
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
      - cert_uploads:/certs:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend

  updater:
    build: ./docker/updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - update_status:/update_status
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped

volumes:
  postgres_data:
  osm_data:
  gh_graph:
  caddy_data:
  caddy_config:
  cert_uploads:
  logo_uploads:
  update_status:
