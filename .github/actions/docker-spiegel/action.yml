name: Docker Hub über einen Spiegel
description: >
  Stellt den Docker-Daemon des Runners auf mirror.gcr.io um, bevor ein Job Images von
  Docker Hub zieht. Ohne Anmeldung teilen sich die GitHub-Runner das Pull-Limit von
  Docker Hub je IP; am 2026-10-09 scheiterten damit alle Docker-Jobs mehrfach mit
  „429 Too Many Requests“, bevor ein Schritt aus diesem Repo lief. Der Spiegel liefert
  dieselben Images (gleiche Digests); was er nicht hat, holt der Daemon wie bisher von
  Docker Hub. Dockerfiles und veröffentlichte Images bleiben unberührt — das gilt nur
  für den Runner.

  Der Eintrag in `registry-mirrors` allein reicht nicht: Am 2026-10-09 fragte der
  Daemon für `docker run` trotzdem Docker Hub (429), obwohl der Spiegel die Images
  hatte. Was ein Job sicher braucht, nennt er deshalb in `images`; die werden
  ausdrücklich vom Spiegel gezogen und lokal unter ihrem Docker-Hub-Namen getaggt.

inputs:
  dockerhub-username:
    description: >
      Docker-Hub-Konto (Secret `DOCKERHUB_USERNAME`). Mit Token meldet sich der Daemon
      an und zieht mit eigenem Kontingent statt dem geteilten Limit der Runner.
      Leer (Fork-PRs) heißt: ohne Anmeldung, wie bisher.
    required: false
    default: ''
  dockerhub-token:
    description: Read-only Access Token dazu (Secret `DOCKERHUB_TOKEN`).
    required: false
    default: ''
  images:
    description: >
      Docker-Hub-Images (durch Leerzeichen getrennt, z. B. `bash:5.2 docker:cli`), die
      vom Spiegel vorab gezogen werden. Fehlt eins dort, bleibt es beim Daemon.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Bei Docker Hub anmelden
      if: inputs.dockerhub-username != '' && inputs.dockerhub-token != ''
      shell: bash
      env:
        DH_USER: ${{ inputs.dockerhub-username }}
        DH_TOKEN: ${{ inputs.dockerhub-token }}
      run: printf '%s' "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

    - name: Docker-Daemon auf mirror.gcr.io umstellen
      shell: bash
      run: |
        set -euo pipefail
        datei=/etc/docker/daemon.json
        vorher='{}'
        if sudo test -s "$datei"; then vorher="$(sudo cat "$datei")"; fi
        printf '%s' "$vorher" \
          | jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' \
          | sudo tee "$datei" >/dev/null
        sudo systemctl restart docker
        # Bis der Daemon wieder antwortet; der Neustart dauert meist unter 5 s.
        for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
        echo "Spiegel: $(docker info --format '{{json .RegistryConfig.Mirrors}}')"

    - name: Images vom Spiegel vorab ziehen
      if: inputs.images != ''
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        set -uo pipefail
        for img in $IMAGES; do
          # Offizielle Images liegen auf Docker Hub unter library/.
          case "$img" in */*) pfad="$img" ;; *) pfad="library/$img" ;; esac
          ok=nein
          for versuch in 1 2 3; do
            if docker pull -q "mirror.gcr.io/$pfad" >/dev/null; then ok=ja; break; fi
            sleep $((versuch * 5))
          done
          if [ "$ok" = ja ]; then
            docker tag "mirror.gcr.io/$pfad" "$img"
            echo "vom Spiegel: $img"
          else
            echo "::warning::$img nicht vom Spiegel zu holen; der Daemon versucht es selbst."
          fi
        done
