name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge Queue: GitHub baut temporäre Merge-Branches (PR + aktueller main) und
  # verlangt die Required Checks darauf. Ohne diesen Trigger würden Einträge in
  # der Queue endlos auf ihre Checks warten.
  merge_group:

# Least privilege: jobs only read the repo. No job needs write access to
# contents, packages, deployments, etc. Overrides the permissive default
# GITHUB_TOKEN scopes (CodeQL: "Workflow does not contain permissions").
permissions:
  contents: read

jobs:
  backend-lint-test:
    name: Backend – Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: convoyplan
          POSTGRES_PASSWORD: convoyplan
          POSTGRES_DB: convoyplan
        options: >-
          --health-cmd "pg_isready -U convoyplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          # Pin ruff: 0.16.0 broadened the default rule set (bugbear, isort,
          # security, simplify, …), turning previously-clean code into 382
          # findings. Pin to the last release before that change so CI stays
          # reproducible; adopt the new rules deliberately in a separate change.
          pip install "ruff==0.15.0" pytest-asyncio

      - name: Lint (ruff)
        run: cd backend && ruff check app/

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://convoyplan:convoyplan@localhost:5432/convoyplan
        run: cd backend && alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://convoyplan:convoyplan@localhost:5432/convoyplan
          JWT_SECRET: ci-test-secret-do-not-use
          GRAPHHOPPER_URL: http://localhost:8989
          LICENSE_KEY: ${{ secrets.CI_LICENSE_KEY }}
        run: cd backend && pytest tests/ -v --tb=short

  frontend-check:
    name: Frontend – Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Svelte type check
        run: cd frontend && npm run check

  docker-build:
    name: Docker – Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend

      - name: Build graphhopper image
        run: docker build ./graphhopper

      - name: Build updater image
        run: docker build ./docker/updater

  dependency-audit:
    name: Security – Dependency Audit
    runs-on: ubuntu-latest
    # Blocking check (ISO 27001 A.8.8 / T10): both pip-audit and npm-audit
    # return zero findings; removed continue-on-error so new advisories block
    # merges. See docs/iso-certifications-review.md (T10).

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        run: cd frontend && npm audit --omit=dev --audit-level=high

  container-scan:
    name: Security – Container Image Scan
    runs-on: ubuntu-latest
    # Trivy scans the built images for OS-/library-level vulnerabilities
    # (ISO 27001 A.8.8 / T10). Fails on HIGH/CRITICAL findings that have a fix
    # available (ignore-unfixed), so unpatchable upstream issues don't block
    # merges while actionable ones do. See docs/iso-certifications-review.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: graphhopper
            context: ./graphhopper
          - name: updater
            context: ./docker/updater
          # Laeuft nicht im Stack, wird aber mit ausgeliefert und bekommt beim
          # Regionswechsel Schreibzugriff auf die Kartendaten — also gehoert es
          # in denselben Scan wie die uebrigen vier.
          - name: osmium
            context: ./docker/osmium

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }} image
        run: docker build -t convoyplan-${{ matrix.name }}:scan ${{ matrix.context }}

      - name: Install Trivy v0.71.0
        # Pin to an immutable release tarball + verify checksum.
        # CVE reference: GHSA-69fq-xp46-6x23 — the trivy ecosystem supply chain
        # was temporarily compromised on 2026-03-19 via the mutable install.sh
        # from the main branch. Pinning to a specific release + checksum
        # verification prevents that class of attack.
        run: |
          VERSION=0.71.0
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_checksums.txt"
          grep "trivy_${VERSION}_Linux-64bit.tar.gz" "trivy_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${VERSION}_Linux-64bit.tar.gz" trivy
          mv trivy /usr/local/bin/trivy
          rm "trivy_${VERSION}_Linux-64bit.tar.gz" "trivy_${VERSION}_checksums.txt"

      - name: Scan ${{ matrix.name }} image (Trivy)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --vuln-type os,library \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --no-progress \
            convoyplan-${{ matrix.name }}:scan

  shell-tests:
    name: Shell – Updater und Entrypoint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Diese Suiten pruefen die Skripte, die den Regionswechsel tragen —
    # switch-region.sh (Phasen, Rollback, Sperren), merge-extracts.sh,
    # region-source.sh und den GraphHopper-Entrypoint. Sie haben die
    # schwerwiegendsten Fehler dieses Features gefunden.
    #
    # Bis hierher liefen sie in KEINEM automatischen Lauf: Es gab sie nur als
    # Dateien im Repo, ausgefuehrt hat sie, wer daran dachte. Ein Test, den
    # niemand startet, altert genauso still wie ungetesteter Code — und der
    # naechste, der eines dieser Skripte anfasst, haette den Bruch nicht
    # bemerkt. Deshalb dieser Job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Alle Shell-Suiten ausfuehren
        run: |
          rc=0
          for t in docker/updater/tests/test_*.sh graphhopper/tests/test_*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "$t: GRUEN"
            else
              echo "::error::$t ist fehlgeschlagen"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

  region-switch:
    name: Region – Wechsel end-to-end (Berlin)
    runs-on: ubuntu-24.04
    # Einziger Test, der die fünf Phasen von docker/updater/switch-region.sh
    # gegeneinander prüft, statt sie per docker-Stub zu simulieren (siehe
    # docker/updater/tests/test_switch_region.sh — dort läuft nie ein
    # Container). Nur mit dem Berlin-Extract (~90 MB): große Regionen (DACH
    # und größer) sprengen Laufzeit und Speicher jedes Runners — das ist eine
    # bewusst benannte Lücke, siehe docs/superpowers/specs/
    # 2026-09-03-kartenregion-im-adminpanel-design.md, Abschnitt 8
    # ("Nicht automatisierbar").
    #
    # timeout-minutes ist nur das Backstop; die eigentliche, lesbare
    # Fehlerbehandlung passiert in den Wartschleifen unten (endliches,
    # großzügiges Zeitlimit je Schritt, mit region.log + Container-Logs bei
    # "failed" oder Zeitüberschreitung statt nur einem roten Kreuz).
    timeout-minutes: 55
    env:
      COMPOSE_PROJECT_NAME: convoyplan-region-ci
      # Muss auf den HOST-Pfad der echten docker-compose.yml zeigen — genau
      # wie scripts/install.sh es beim echten Setup tut (dort:
      # STACK_FILE_PATH=${INSTALL_DIR}/docker-compose.yml). Ohne das findet
      # switch-region.sh:_resolve_compose_files() keine Compose-Datei (der
      # Default-Mount ist /dev/null) und scheitert schon vor Phase 4.
      STACK_FILE_PATH: ${{ github.workspace }}/docker-compose.yml
      POSTGRES_PASSWORD: ci-region-switch-not-a-real-secret
      # Produktions-Default (APP_ENV=production) verweigert dem Backend den
      # Start, wenn JWT_SECRET auf dem Default steht oder kürzer als 32
      # Zeichen ist (siehe .env.example) — deshalb hier ein eigener, langer
      # Wert statt des Defaults.
      JWT_SECRET: ci-region-switch-jwt-secret-do-not-reuse-anywhere-else
      LICENSE_KEY: ${{ secrets.CI_LICENSE_KEY }}
      # Die äußere Schleife von docker/updater/update-images.sh prüft
      # region_request.json nur einmal pro Zyklus; mit dem Produktions-
      # Default von 300s könnte das bis zu 5 Minuten kosten, bevor Phase 1
      # überhaupt beginnt.
      UPDATE_INTERVAL: "15"
      # Ersteinstieg bewusst NICHT auf Berlin: eine von Berlin verschiedene,
      # winzige Region hält den Erststart kurz und macht den späteren Wechsel
      # zu einem echten Regionswechsel (altes Extract/alter Graph müssen
      # wirklich weichen), nicht zu einem Wechsel auf dieselbe Region.
      # Liechtenstein ist auch in GraphHoppers eigenen Beispielen die
      # Standard-Winzregion für genau diesen Zweck.
      OSM_DOWNLOAD_URL: https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
      OSM_FILENAME: liechtenstein-latest.osm.pbf
      JAVA_OPTS: "-Xmx2g -Xms512m -XX:+UseG1GC"
      # PR-Stand statt der veröffentlichten Images von GHCR — sonst würde
      # dieser Test die alte, schon veröffentlichte Version prüfen statt der
      # Änderungen in diesem Branch. Der Repository-Teil ("convoyplan-*",
      # ohne "ghcr.io/..."-Praefix) reicht dafuer bereits aus und kollidiert
      # nicht mit den echten, veroeffentlichten Images.
      #
      # Der TAG muss zusaetzlich exakt ":latest" sein (nicht z. B.
      # ":region-ci"): der Updater fuehrt in der Hauptschleife von
      # update-images.sh VOR jedem Regionswechsel-Check auch den normalen
      # Auto-Update-Check aus (check_target_and_update -> do_update), und der
      # ruft _apply_channel_images() auf. Die schreibt GRAPHHOPPER_IMAGE (und
      # BACKEND_IMAGE/UPDATER_IMAGE) unbedingt via _retag() auf den Tag des
      # aktiven Kanals um — mangels /update_status/channel-Datei Kanal
      # "stable", also Tag "latest" (siehe update-images.sh:_channel_tag).
      # In einer frischen CI-Umgebung existiert /update_status/last_deployed
      # noch nicht, der erste Zyklus haelt das Ziel also fuer "neu" und loest
      # genau dieses Umschreiben aus - unabhaengig vom eigentlichen
      # Regionswechsel-Trigger. Ein eigener Tag wie ":region-ci" wird dabei
      # auf ":latest" umgeschrieben (_retag("convoyplan-graphhopper:region-ci",
      # "latest") = "convoyplan-graphhopper:latest") — ein Image-Name, den
      # niemand gebaut hat. _import_graph() in switch-region.sh startet den
      # Wegwerf-Container danach per `docker run "$GRAPHHOPPER_IMAGE"`; ohne
      # lokal vorhandenes Image versucht Docker implizit ein `pull`, das für
      # dieses rein lokale, nicht veroeffentlichte Image fehlschlaegt ("pull
      # access denied"). Ist der gebaute Tag dagegen bereits ":latest", ist
      # dieses Umschreiben ein No-op (_retag(x:latest, latest) = x:latest) -
      # der Name bleibt in jedem Fall mit dem gebauten Image identisch, ganz
      # gleich ob/wann der Auto-Update-Check zwischenzeitlich zuschlaegt.
      BACKEND_IMAGE: convoyplan-backend:latest
      GRAPHHOPPER_IMAGE: convoyplan-graphhopper:latest
      UPDATER_IMAGE: convoyplan-updater:latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Images aus dem PR-Stand bauen (lokale Tags, nicht die von GHCR)
        run: |
          docker build -t convoyplan-backend:latest ./backend
          docker build -t convoyplan-graphhopper:latest ./graphhopper
          docker build -t convoyplan-updater:latest ./docker/updater

      - name: Stack starten (Entrypoint update-images.sh, wie docker-compose.yml:273 es real festlegt)
        run: docker compose up -d graphhopper updater

      - name: Auf gesunden Ersteinstieg warten (Liechtenstein, max. 8 min)
        run: |
          for _ in $(seq 1 96); do
            if curl -fsS http://127.0.0.1:8989/health >/dev/null 2>&1; then
              echo "GraphHopper (Ersteinstieg Liechtenstein) ist gesund."
              exit 0
            fi
            sleep 5
          done
          echo "::error::GraphHopper wurde beim Ersteinstieg nicht gesund."
          docker compose logs --no-color graphhopper
          exit 1

      - name: Regionswechsel auf Berlin auslösen
        run: |
          printf '%s' '{"url":"https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf","filename":"berlin-latest.osm.pbf","java_opts":"-Xmx3g -Xms512m -XX:+UseG1GC","requested_by":"ci@convoyplan"}' \
            | docker compose exec -T updater tee /update_status/region_request.json >/dev/null

      - name: Auf Abschluss warten (max. 40 min)
        run: |
          done=0
          for _ in $(seq 1 240); do
            phase="$(docker compose exec -T updater cat /update_status/region_status.json 2>/dev/null \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('phase','?'))" 2>/dev/null || echo -)"
            echo "Phase: ${phase:--}"
            if [ "$phase" = "done" ]; then
              done=1
              break
            fi
            if [ "$phase" = "failed" ]; then
              echo "::error::Regionswechsel ist fehlgeschlagen — region.log:"
              docker compose exec -T updater cat /update_status/region.log || true
              echo "::group::Container-Logs"
              docker compose logs --no-color
              echo "::endgroup::"
              exit 1
            fi
            sleep 10
          done
          if [ "$done" -ne 1 ]; then
            echo "::error::Zeitlimit (40 Min.) erreicht — kein 'done' in region_status.json."
            docker compose exec -T updater cat /update_status/region.log || true
            echo "::group::Container-Logs"
            docker compose logs --no-color
            echo "::endgroup::"
            exit 1
          fi

      - name: "Beleg 1/3: GraphHopper routet tatsächlich in der neuen Region"
        run: |
          region_content="$(docker compose exec -T graphhopper cat /data/osm/.region)"
          echo "$region_content"
          echo "$region_content" | grep -q '^OSM_FILENAME=berlin-latest\.osm\.pbf$' || {
            echo "::error::/data/osm/.region zeigt nicht auf Berlin — nur 'Container gesund' beweist das nicht."
            exit 1
          }
          response="$(curl -fsS 'http://127.0.0.1:8989/route?point=52.5200,13.4050&point=52.5000,13.3800&profile=car&locale=de')"
          echo "$response" | grep -q '"paths"' || {
            echo "::error::Routenanfrage innerhalb Berlins ist fehlgeschlagen."
            echo "$response"
            exit 1
          }
          echo "Routenanfrage innerhalb Berlins erfolgreich."

      - name: "Beleg 2/3: Graph wurde beim Schwenk NICHT neu gebaut"
        run: |
          logs="$(docker compose logs --no-color graphhopper)"
          # entrypoint.sh schreibt "…Routing-Graph wird / aus den OSM-Daten neu
          # gebaut…" NUR, wenn Fingerprint (Region+Encoded-Values) oder ein
          # frischer Download einen Rebuild auslösen. Taucht die Zeile in den
          # Logs des NACH dem Schwenk neu erzeugten Containers auf, hat
          # GraphHopper den vom Import vorbereiteten Graphen verworfen und neu
          # gebaut — die Zusage "Sekunden statt Stunden" wäre nicht eingelöst.
          if echo "$logs" | grep -q 'Routing-Graph wird'; then
            echo "::error::entrypoint.sh hat den Graphen neu gebaut statt den geschwenkten zu übernehmen."
            echo "$logs" | grep -A1 'Routing-Graph wird'
            exit 1
          fi
          echo "Kein Rebuild-Hinweis in den GraphHopper-Logs — der geschwenkte Graph wurde übernommen."

      - name: "Beleg 3/3: Sperrdateien sind nach 'done' aufgeräumt"
        run: |
          docker compose exec -T updater sh -c '
            for f in region.lock region_request.json region.cancel; do
              if [ -f "/update_status/$f" ]; then
                echo "::error::/update_status/$f liegt noch — würde jeden weiteren Regionswechsel mit 409 blockieren."
                exit 1
              fi
            done
            echo "region.lock, region_request.json und region.cancel sind wie erwartet weg."
          '

      - name: Stack stoppen
        if: always()
        run: docker compose down -v

  region-merge:
    name: Region – Grenzrouting bei zusammengeführten Extracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Beantwortet fortlaufend die Frage, die vor dem Entwurf einmalig als
    # Wegwerf-Spike beantwortet wurde: Routet GraphHopper über die Grenze
    # zwischen zwei getrennt heruntergeladenen, per `osmium merge`
    # zusammengeführten Geofabrik-Extracts?
    #
    # Der Spike mass: Görlitz→Zgorzelec 2,30 km, Dresden→Wrocław 268,3 km,
    # und 294.181 deduplizierte Knoten (0,67 %) im Grenzstreifen. Er hat
    # bewiesen, dass es geht — dieser Job beweist, dass es so bleibt.
    #
    # Die Kontrollroute innerhalb Sachsens ist nicht optional: Ohne sie
    # unterscheidet der Job nicht zwischen "Grenze kaputt" und "Graph
    # generell kaputt".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: osmium installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Extracts laden
        run: |
          mkdir -p osm
          curl -fsSL -o osm/sachsen.osm.pbf      https://download.geofabrik.de/europe/germany/sachsen-latest.osm.pbf
          curl -fsSL -o osm/dolnoslaskie.osm.pbf https://download.geofabrik.de/europe/poland/dolnoslaskie-latest.osm.pbf
          ls -lh osm/

      - name: Zusammenführen und Deduplizierung belegen
        run: |
          time osmium merge osm/sachsen.osm.pbf osm/dolnoslaskie.osm.pbf -o osm/merged.osm.pbf
          A=$(osmium fileinfo -e -g data.count.nodes osm/sachsen.osm.pbf)
          B=$(osmium fileinfo -e -g data.count.nodes osm/dolnoslaskie.osm.pbf)
          M=$(osmium fileinfo -e -g data.count.nodes osm/merged.osm.pbf)
          echo "sachsen=$A dolnoslaskie=$B merged=$M"
          # Die Ueberlappung MUSS zusammengefuehrt worden sein: Ist merged
          # gleich der Rohsumme, hat osmium nichts dedupliziert, und der
          # Graph zerfaellt an der Grenze in zwei Komponenten.
          if [ "$M" -ge "$((A + B))" ]; then
            echo "::error::Keine Deduplizierung — merged ($M) >= sachsen+dolnoslaskie ($((A+B)))"
            exit 1
          fi
          echo "Dedupliziert: $((A + B - M)) Knoten"
          echo "MERGED_NODES=$M" >> "$GITHUB_ENV"

      - name: merge-extracts.sh gegen das echte osmium-Image
        run: |
          # Erster echter Lauf des Produktionspfads. Bis hierher pruefte die
          # Shell-Suite merge-extracts.sh nur gegen einen docker-Stub, und der
          # Schritt oben rief osmium direkt auf dem Runner auf. Ungetestet blieb
          # genau das, was in Produktion zaehlt: das eigene osmium-Image, der
          # `docker run` mit Volume-NAME statt Containerpfad, und die
          # Plausibilitaetsgrenzen gegen echte Dateigroessen.
          #
          # Der Aufruf laeuft bewusst IM Updater-Image mit Docker-Socket und
          # gemountetem Volume — also in derselben Lage wie beim echten
          # Regionswechsel. Ein Aufruf vom Runner aus waere eine andere
          # Konfiguration und bewiese wenig: merge-extracts.sh setzt voraus,
          # dass sein Host-Pfad und der Volume-Inhalt dasselbe Verzeichnis sind.
          docker build -t convoyplan-osmium:ci ./docker/osmium
          docker build -t convoyplan-updater:ci ./docker/updater
          docker volume create ci_osm > /dev/null
          docker run --rm -v ci_osm:/data/osm -v "$PWD/osm:/src:ro" \
            convoyplan-osmium:ci \
            sh -c 'cp /src/sachsen.osm.pbf /src/dolnoslaskie.osm.pbf /data/osm/'
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ci_osm:/data/osm \
            -e OSM_VOLUME=ci_osm \
            -e REGION_MERGE_IMAGE=convoyplan-osmium:ci \
            --entrypoint bash convoyplan-updater:ci \
            /merge-extracts.sh /data/osm/merged-ci.osm.pbf \
              /data/osm/sachsen.osm.pbf /data/osm/dolnoslaskie.osm.pbf

      - name: Ergebnis des Skriptlaufs gegen den Direktaufruf halten
        run: |
          # Gleiche Knotenzahl wie beim Direktaufruf oben — sonst hat der Weg
          # ueber Image und Volume unterwegs etwas verloren. Genau diese Art
          # stillen Verlusts ist der Grund fuer die Struktur-Zusicherungen in
          # merge-extracts.sh; hier wird sie einmal echt nachgemessen.
          S=$(docker run --rm -v ci_osm:/data/osm convoyplan-osmium:ci \
                osmium fileinfo -e -g data.count.nodes /data/osm/merged-ci.osm.pbf)
          echo "Skriptlauf=$S  Direktaufruf=$MERGED_NODES"
          if [ "$S" != "$MERGED_NODES" ]; then
            echo "::error::merge-extracts.sh lieferte $S Knoten, der Direktaufruf $MERGED_NODES"
            exit 1
          fi

      - name: osmium-Volume aufraeumen
        if: always()
        run: docker volume rm -f ci_osm || true

      - name: GraphHopper bauen und starten
        run: |
          docker build -t gh-merge:latest ./graphhopper
          docker run -d --name gh -p 8989:8989 \
            -v "$PWD/osm:/data/osm" -v gh_merge_graph:/data/graph \
            -e OSM_FILENAME=merged.osm.pbf \
            -e OSM_DOWNLOAD_URL=https://download.geofabrik.de/europe/germany/sachsen-latest.osm.pbf \
            -e JAVA_OPTS=-Xmx6g \
            -e REGION_SOURCE_SCRIPT=/dev/null \
            gh-merge:latest
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8989/health > /dev/null 2>&1; then echo "bereit nach ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "::error::GraphHopper nicht bereit"
          docker logs gh 2>&1 | tail -40
          exit 1

      - name: Kontrollroute innerhalb Sachsens
        id: ctl
        run: |
          curl -s "http://localhost:8989/route?point=51.0504,13.7373&point=51.3397,12.3731&profile=car&calc_points=false" -o r.json
          D=$(jq -r '.paths[0].distance // "KEINE"' r.json)
          echo "dist=$D" >> "$GITHUB_OUTPUT"
          echo "Dresden -> Leipzig: $D"

      - name: Kurze Grenzroute Görlitz nach Zgorzelec
        id: short
        run: |
          curl -s "http://localhost:8989/route?point=51.1524,14.9887&point=51.1490,15.0080&profile=car&calc_points=false" -o r.json
          D=$(jq -r '.paths[0].distance // "KEINE"' r.json)
          echo "dist=$D" >> "$GITHUB_OUTPUT"
          echo "Goerlitz -> Zgorzelec: $D"

      - name: Lange Grenzroute Dresden nach Wrocław
        id: long
        run: |
          curl -s "http://localhost:8989/route?point=51.0504,13.7373&point=51.1079,17.0385&profile=car&calc_points=false" -o r.json
          D=$(jq -r '.paths[0].distance // "KEINE"' r.json)
          echo "dist=$D" >> "$GITHUB_OUTPUT"
          echo "Dresden -> Wroclaw: $D"

      - name: Ergebnis
        run: |
          CTL='${{ steps.ctl.outputs.dist }}'
          SHORT='${{ steps.short.outputs.dist }}'
          LONG='${{ steps.long.outputs.dist }}'
          echo "Kontrolle DE-intern : $CTL"
          echo "Goerlitz->Zgorzelec : $SHORT"
          echo "Dresden ->Wroclaw   : $LONG"
          if [ "$CTL" = "KEINE" ]; then
            echo "::error::Kontrollroute schlaegt fehl — Graph unbrauchbar, Test aussagelos"
            exit 1
          fi
          if [ "$SHORT" = "KEINE" ] || [ "$LONG" = "KEINE" ]; then
            echo "::error::Grenzueberschreitendes Routing funktioniert NICHT"
            exit 1
          fi
          echo "Routing ueber die Grenze funktioniert."

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker logs gh 2>&1 | tail -60
