name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend – Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: marschplan
          POSTGRES_PASSWORD: marschplan
          POSTGRES_DB: marschplan
        options: >-
          --health-cmd "pg_isready -U marschplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest-asyncio

      - name: Lint (ruff)
        run: cd backend && ruff check app/

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://marschplan:marschplan@localhost:5432/marschplan
        run: cd backend && alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://marschplan:marschplan@localhost:5432/marschplan
          JWT_SECRET: ci-test-secret-do-not-use
          GRAPHHOPPER_URL: http://localhost:8989
        run: cd backend && pytest tests/ -v --tb=short

  frontend-check:
    name: Frontend – Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Svelte type check
        run: cd frontend && npm run check

  docker-build:
    name: Docker – Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend
