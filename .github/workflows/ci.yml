name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only read the repo. No job needs write access to
# contents, packages, deployments, etc. Overrides the permissive default
# GITHUB_TOKEN scopes (CodeQL: "Workflow does not contain permissions").
permissions:
  contents: read

jobs:
  backend-lint-test:
    name: Backend – Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: convoyplan
          POSTGRES_PASSWORD: convoyplan
          POSTGRES_DB: convoyplan
        options: >-
          --health-cmd "pg_isready -U convoyplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest-asyncio

      - name: Lint (ruff)
        run: cd backend && ruff check app/

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://convoyplan:convoyplan@localhost:5432/convoyplan
        run: cd backend && alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://convoyplan:convoyplan@localhost:5432/convoyplan
          JWT_SECRET: ci-test-secret-do-not-use
          GRAPHHOPPER_URL: http://localhost:8989
          LICENSE_KEY: eyJpZCI6IjAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMSIsImN1c3RvbWVyIjoiQ0kgVGVzdGluZyIsImVtYWlsIjoiY2lAY29udm95cGxhbi5pbnRlcm5hbCIsImlzc3VlZCI6IjIwMjYtMDUtMTkiLCJleHBpcmVzIjoiMjAzNi0wNS0xNiIsIm1heF91c2VycyI6NTB9.gwjDBgCYQ2XEsw90sw2RMwiVmtXCmdO6r8Lxpjrf5kugOexOFXDzIrXmoh7yfTu4MWX8hcOlE4-xw766WqeJBQ
        run: cd backend && pytest tests/ -v --tb=short

  frontend-check:
    name: Frontend – Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Svelte type check
        run: cd frontend && npm run check

  docker-build:
    name: Docker – Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend

      - name: Build graphhopper image
        run: docker build ./graphhopper

      - name: Build updater image
        run: docker build ./docker/updater

  dependency-audit:
    name: Security – Dependency Audit
    runs-on: ubuntu-latest
    # Blocking check (ISO 27001 A.8.8 / T10): both pip-audit and npm-audit
    # return zero findings; removed continue-on-error so new advisories block
    # merges. See docs/iso-certifications-review.md (T10).

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        run: cd frontend && npm audit --omit=dev --audit-level=high

  container-scan:
    name: Security – Container Image Scan
    runs-on: ubuntu-latest
    # Trivy scans the built images for OS-/library-level vulnerabilities
    # (ISO 27001 A.8.8 / T10). Fails on HIGH/CRITICAL findings that have a fix
    # available (ignore-unfixed), so unpatchable upstream issues don't block
    # merges while actionable ones do. See docs/iso-certifications-review.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: graphhopper
            context: ./graphhopper
          - name: updater
            context: ./docker/updater

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build ${{ matrix.name }} image
        run: docker build -t convoyplan-${{ matrix.name }}:scan ${{ matrix.context }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan ${{ matrix.name }} image (Trivy)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --vuln-type os,library \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --no-progress \
            convoyplan-${{ matrix.name }}:scan
