name: Release

on:
  # Build & push :latest only from a deliberate version tag (or a manual
  # dispatch) — NOT on every push to main. This breaks the "merge → :latest →
  # auto-pulled onto every customer instance within minutes" chain: deploying
  # now requires cutting a release tag (git tag vX.Y.Z && git push --tags).
  #
  # A pre-release tag (suffix, e.g. v2026.2.1-beta.1) builds the same versioned
  # images plus the floating :beta tag and publishes a GitHub *pre-release*
  # (Beta channel) — it does NOT move :latest, so stable instances are untouched
  # (GitHub /releases/latest ignores pre-releases). The every-commit :nightly
  # images are built separately by nightly-images.yml.
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: >-
          Auch die unveraenderten Images neu bauen. Der Normalfall ist "aus":
          ein Bau ohne Aenderung kostet auf jeder Installation einen
          Container-Tausch.
        type: boolean
        default: false

# Least privilege pro Job: nur der Signier-Job bekommt id-token, nur der
# Release-Job Schreibrecht auf contents.
permissions:
  contents: read

# Serialize releases so two runs can never push :latest concurrently and race.
concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Nur fuer `cosign sign`: der Job tauscht das OIDC-Token gegen ein
      # kurzlebiges Fulcio-Zertifikat. Kein privater Schluessel im Spiel.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need full history + tags for `git describe`

      - name: Determine app version
        id: appver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Prerelease genau dann, wenn der Tag einen Suffix trägt (z. B.
            # v2026.2.1-beta.1 → Kanal "Beta"). Bewusst NUR am Tag festgemacht:
            # ein untagged workflow_dispatch (dessen `git describe` ein
            # "-N-gsha"-Suffix enthalten kann) soll weiterhin :latest bauen.
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            version="$(git describe --tags --always 2>/dev/null | sed 's/^v//')"
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${version} (prerelease=${prerelease})"

      # GHCR-Repositorynamen muessen klein geschrieben sein. metadata-action
      # macht das fuer seine Tags selbst; die cosign-Aufrufe unten brauchen den
      # Namen aber roh.
      - name: Repositoryname in Kleinbuchstaben
        id: repo
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata – backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          # latest=false: die :latest-/:beta-Tags werden unten explizit gesetzt,
          # sonst hängt metadata-action :latest bei JEDEM Tag an (auch Prereleases).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      - name: Docker metadata – frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      - name: Docker metadata – graphhopper
        id: meta-graphhopper
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/graphhopper
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      - name: Docker metadata – updater
        id: meta-updater
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/updater
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      # osmium-tool fuer den Regionswechsel. Es laeuft nicht im Stack, sondern
      # wird vom Updater fuer die Dauer eines Merge gestartet
      # (docker/updater/merge-extracts.sh) — es muss aber mit den uebrigen
      # Images versioniert sein, damit ein gepinntes Deployment nicht
      # unbemerkt gegen ein neueres osmium laeuft.
      - name: Docker metadata – osmium
        id: meta-osmium
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/osmium
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      # Base-Images stammen alle von Docker Hub und sind gelegentlich von
      # transienten Registry-Timeouts betroffen ("i/o timeout" beim Auflösen
      # der Manifest-Metadaten). Wir ziehen sie deshalb vorab mit Retry +
      # exponentiellem Backoff. build-push-action nutzt per Default pull: false,
      # daher greift BuildKit anschließend auf das lokal gecachte Image zu und
      # muss die Registry für diesen Schritt nicht erneut kontaktieren.
      - name: Pre-pull base images (resilient gegen Registry-Timeouts)
        run: |
          images=(
            "python:3.14-slim"
            "node:26-alpine"
            "eclipse-temurin:25-jre-alpine"
            "docker:cli"
            "debian:trixie-slim"
          )
          for image in "${images[@]}"; do
            n=0
            until docker pull "$image"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::Konnte $image nach $n Versuchen nicht ziehen"
                exit 1
              fi
              delay=$((2 ** n))
              echo "Pull von $image fehlgeschlagen (Versuch $n). Neuer Versuch in ${delay}s…"
              sleep "$delay"
            done
          done

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.version }}

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.version }}

      # ── Die drei statischen Images ──────────────────────────────────────
      # graphhopper, updater und osmium haengen nicht am Anwendungscode: ihre
      # Verzeichnisse aendern sich selten, gebaut wurden sie bisher trotzdem
      # bei jedem Lauf. Jeder Bau erzeugt einen neuen Digest — Commit-SHA und
      # Zeitstempel stehen als Label in der Image-Konfiguration, und die
      # gehoert zum Digest. Der Updater auf den Installationen sieht eine neue
      # Image-ID und tauscht den Container: bei GraphHopper mit minutenlangem
      # Routing-Ausfall fuer das erneute Laden des Graphen, ohne dass sich am
      # Image ein Byte geaendert haette.
      #
      # Die Aktion baut deshalb nur bei einem Grund (Quelltext, Base-Image,
      # Alter) und laesst den beweglichen Tag sonst stehen, wo er steht.
      # Begruendung und Entscheidungslogik: .github/actions/build-or-reuse/.

      - name: graphhopper bauen oder weiterverwenden
        id: build-graphhopper
        uses: ./.github/actions/build-or-reuse
        with:
          image: ghcr.io/${{ steps.repo.outputs.lowercase }}/graphhopper
          context: ./graphhopper
          source-path: graphhopper
          channel-tag: ${{ steps.appver.outputs.prerelease == 'true' && 'beta' || 'latest' }}
          tags: ${{ steps.meta-graphhopper.outputs.tags }}
          labels: ${{ steps.meta-graphhopper.outputs.labels }}
          force: ${{ inputs.force_rebuild || false }}

      - name: updater bauen oder weiterverwenden
        id: build-updater
        uses: ./.github/actions/build-or-reuse
        with:
          image: ghcr.io/${{ steps.repo.outputs.lowercase }}/updater
          context: ./docker/updater
          source-path: docker/updater
          channel-tag: ${{ steps.appver.outputs.prerelease == 'true' && 'beta' || 'latest' }}
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
          force: ${{ inputs.force_rebuild || false }}

      - name: osmium bauen oder weiterverwenden
        id: build-osmium
        uses: ./.github/actions/build-or-reuse
        with:
          image: ghcr.io/${{ steps.repo.outputs.lowercase }}/osmium
          context: ./docker/osmium
          source-path: docker/osmium
          channel-tag: ${{ steps.appver.outputs.prerelease == 'true' && 'beta' || 'latest' }}
          tags: ${{ steps.meta-osmium.outputs.tags }}
          labels: ${{ steps.meta-osmium.outputs.labels }}
          force: ${{ inputs.force_rebuild || false }}

      # ── Signatur (Sigstore/cosign, keyless) ─────────────────────────────
      # Ohne Signatur heisst "Image mit dem richtigen Tag" nur: irgendjemand
      # mit Schreibrecht auf GHCR hat es dort abgelegt. Der Updater auf jeder
      # Kundeninstallation zieht genau danach — und haelt dabei den nackten
      # Docker-Socket. Ein kompromittiertes Repo-Token waere damit Root auf
      # jeder Installation mit Auto-Update.
      #
      # Keyless: die Identitaet ist dieser Workflow (OIDC-Token von GitHub),
      # kein privater Schluessel liegt irgendwo herum. Signiert wird der
      # Digest, nicht der Tag — Tags sind beweglich, Digests nicht. Die
      # Signatur gilt damit fuer alle Tags, die auf denselben Digest zeigen.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          # GHCR verlangt Kleinbuchstaben; ${{ github.repository }} traegt sie
          # nicht zwingend. metadata-action normalisiert selbst, hier nicht.
          REPO_LC: ${{ steps.repo.outputs.lowercase }}
          DIGEST_BACKEND: ${{ steps.build-backend.outputs.digest }}
          DIGEST_FRONTEND: ${{ steps.build-frontend.outputs.digest }}
          DIGEST_GRAPHHOPPER: ${{ steps.build-graphhopper.outputs.digest }}
          DIGEST_UPDATER: ${{ steps.build-updater.outputs.digest }}
          DIGEST_OSMIUM: ${{ steps.build-osmium.outputs.digest }}
          # Ob die drei statischen Images in DIESEM Lauf wirklich gebaut
          # wurden — siehe .github/actions/build-or-reuse.
          REBUILT_GRAPHHOPPER: ${{ steps.build-graphhopper.outputs.rebuilt }}
          REBUILT_UPDATER: ${{ steps.build-updater.outputs.rebuilt }}
          REBUILT_OSMIUM: ${{ steps.build-osmium.outputs.rebuilt }}
        run: |
          set -euo pipefail
          # backend und frontend werden immer gebaut (der Commit-SHA steckt als
          # Build-Arg im Image), die drei anderen nur bei Bedarf. Ein
          # weiterverwendetes Image braucht keine zweite Signatur: cosign
          # signiert den DIGEST, und genau der ist unveraendert — ein erneuter
          # Aufruf legte nur einen weiteren Eintrag ins Transparenzlog.
          for entry in \
            "backend|${DIGEST_BACKEND}|true" \
            "frontend|${DIGEST_FRONTEND}|true" \
            "graphhopper|${DIGEST_GRAPHHOPPER}|${REBUILT_GRAPHHOPPER}" \
            "updater|${DIGEST_UPDATER}|${REBUILT_UPDATER}" \
            "osmium|${DIGEST_OSMIUM}|${REBUILT_OSMIUM}"
          do
            IFS='|' read -r name digest rebuilt <<<"${entry}"
            if [ -z "$digest" ]; then
              echo "::error::Kein Digest fuer $name — weder gebaut noch vorgefunden"
              exit 1
            fi
            if [ "$rebuilt" != "true" ]; then
              echo "Ueberspringe $name — unveraendert, ${digest} traegt die Signatur seines Baus."
              continue
            fi
            echo "Signiere ghcr.io/${REPO_LC}/${name}@${digest}"
            cosign sign --yes "ghcr.io/${REPO_LC}/${name}@${digest}"
          done

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine prerelease
        id: pre
        run: |
          # Tag mit Suffix (v2026.2.1-beta.1) → GitHub-Prerelease. GitHubs
          # /releases/latest (Stable-Kanal) blendet Prereleases automatisch aus.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.pre.outputs.prerelease }}
