name: Release

on:
  # Build & push :latest only from a deliberate version tag (or a manual
  # dispatch) — NOT on every push to main. This breaks the "merge → :latest →
  # auto-pulled onto every customer instance within minutes" chain: deploying
  # now requires cutting a release tag (git tag vX.Y.Z && git push --tags).
  #
  # A pre-release tag (suffix, e.g. v2026.2.1-beta.1) builds the same versioned
  # images plus the floating :beta tag and publishes a GitHub *pre-release*
  # (Beta channel) — it does NOT move :latest, so stable instances are untouched
  # (GitHub /releases/latest ignores pre-releases). The every-commit :nightly
  # images are built separately by nightly-images.yml.
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Serialize releases so two runs can never push :latest concurrently and race.
concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # need full history + tags for `git describe`

      - name: Determine app version
        id: appver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Prerelease genau dann, wenn der Tag einen Suffix trägt (z. B.
            # v2026.2.1-beta.1 → Kanal "Beta"). Bewusst NUR am Tag festgemacht:
            # ein untagged workflow_dispatch (dessen `git describe` ein
            # "-N-gsha"-Suffix enthalten kann) soll weiterhin :latest bauen.
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            version="$(git describe --tags --always 2>/dev/null | sed 's/^v//')"
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${version} (prerelease=${prerelease})"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata – backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          # latest=false: die :latest-/:beta-Tags werden unten explizit gesetzt,
          # sonst hängt metadata-action :latest bei JEDEM Tag an (auch Prereleases).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      - name: Docker metadata – frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      - name: Docker metadata – graphhopper
        id: meta-graphhopper
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/graphhopper
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      - name: Docker metadata – updater
        id: meta-updater
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/updater
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.appver.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.appver.outputs.prerelease == 'true' }}

      # Base-Images stammen alle von Docker Hub und sind gelegentlich von
      # transienten Registry-Timeouts betroffen ("i/o timeout" beim Auflösen
      # der Manifest-Metadaten). Wir ziehen sie deshalb vorab mit Retry +
      # exponentiellem Backoff. build-push-action nutzt per Default pull: false,
      # daher greift BuildKit anschließend auf das lokal gecachte Image zu und
      # muss die Registry für diesen Schritt nicht erneut kontaktieren.
      - name: Pre-pull base images (resilient gegen Registry-Timeouts)
        run: |
          images=(
            "python:3.14-slim"
            "node:26-alpine"
            "eclipse-temurin:25-jre-alpine"
            "docker:cli"
          )
          for image in "${images[@]}"; do
            n=0
            until docker pull "$image"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::Konnte $image nach $n Versuchen nicht ziehen"
                exit 1
              fi
              delay=$((2 ** n))
              echo "Pull von $image fehlgeschlagen (Versuch $n). Neuer Versuch in ${delay}s…"
              sleep "$delay"
            done
          done

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.version }}

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.version }}

      - name: Build and push graphhopper
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./graphhopper
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-graphhopper.outputs.tags }}
          labels: ${{ steps.meta-graphhopper.outputs.labels }}

      - name: Build and push updater
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./docker/updater
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Determine prerelease
        id: pre
        run: |
          # Tag mit Suffix (v2026.2.1-beta.1) → GitHub-Prerelease. GitHubs
          # /releases/latest (Stable-Kanal) blendet Prereleases automatisch aus.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.pre.outputs.prerelease }}
