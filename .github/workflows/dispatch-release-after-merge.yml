name: Dispatch Release after merge

# Auto-Merge mergt PRs mit dem GITHUB_TOKEN; GitHub unterdrueckt fuer solche
# Pushes alle nachgelagerten Workflow-Trigger (Schutz gegen Endlos-Loops).
# Folge: Release.yml laeuft nach Auto-Merge nicht und es entsteht kein neues
# Image. Dieser Workflow haengt sich an pull_request_target:closed (vom
# GITHUB_TOKEN-Filter NICHT betroffen) und dispatcht Release manuell.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -R ${{ github.repository }}
