name: Auto-merge

# Aktiviert GitHubs nativen Auto-Merge ("Merge when ready") für Pull Requests,
# die das Label "auto-merge" tragen. Da das Ruleset eine MERGE QUEUE erzwingt,
# landet der PR damit automatisch in der Queue, sobald seine eigenen Checks
# grün sind. Die Queue arbeitet die Einträge dann seriell (älteste zuerst) ab:
# temporären Merge-Branch mit aktuellem main bauen → Required Checks darauf
# laufen lassen → mergen → nächster Eintrag. Ein "Update branch" von Hand ist
# damit nie mehr nötig, auch wenn sich main laufend ändert.
#
# Dependabot-PRs erhalten das Label "auto-merge" automatisch und werden somit
# nach grünen Checks ebenfalls automatisch gemergt (nur patch/minor — major
# bleibt zur manuellen Review offen). Nach dem Abarbeiten einer Dependabot-
# Welle schneidet auto-release.yml automatisch ein Patch-Release.
#
# Voraussetzungen (einmalig in den Repo-Settings, siehe
# .github/repo-setup-checklist.md):
#   1. Settings → General → "Allow auto-merge" aktivieren.
#   2. Ruleset aus .github/rulesets/main.json importieren (Required Checks +
#      Merge Queue).
#   3. Label "auto-merge" anlegen.
#
# Hinweis zur Sicherheit: Wir nutzen pull_request_target und checken bewusst
# KEINEN PR-Code aus. Der Job ruft ausschließlich die GitHub-API auf, daher
# ist die Verwendung des schreibenden Tokens hier unkritisch. pull_request_target
# läuft zudem im Kontext des Basis-Repos und hat damit auch bei Dependabot-PRs
# die nötigen Schreibrechte.
#
# WICHTIG (Merge Queue!): Der eingebaute GITHUB_TOKEN kann Auto-Merge zwar
# *aktivieren*, aber GitHub lässt ihn einen PR NICHT in eine Merge Queue
# einreihen ("the built-in GITHUB_TOKEN cannot add pull requests to the
# queue"). Für Dependabot-PRs sieht es dann so aus, als würde nichts passieren:
# Auto-Merge ist an, die Checks sind grün — der PR landet aber nie in der Queue
# und bleibt offen. Deshalb MUSS der Merge-Schritt mit einem eigenen Token
# laufen (Fine-grained PAT oder GitHub-App-Token) mit den Rechten
# "Contents: write" + "Pull requests: write". Siehe Secret MERGE_QUEUE_TOKEN
# und .github/repo-setup-checklist.md. Fehlt das Secret, fällt der Workflow auf
# GITHUB_TOKEN zurück (Auto-Merge wird aktiviert, der PR wird aber nicht
# eingereiht) — das erklärt genau den bisherigen Zustand.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge (squash)
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'auto-merge') ||
       github.actor == 'dependabot[bot]')
    steps:
      # For Dependabot PRs, determine the semver update type so we can auto-merge
      # only low-risk patch/minor bumps. Major bumps (potential breaking changes)
      # are left open for a human to review.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label Dependabot PR with auto-merge
        if: >-
          github.actor == 'dependabot[bot]' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(github.event.pull_request.labels.*.name, 'auto-merge')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label "auto-merge"

      # Enable native auto-merge for manually-labelled PRs (any) and for
      # Dependabot patch/minor updates. Dependabot major bumps fall through.
      # With a merge queue required on main, "auto merge" means "add to the
      # queue when ready". Newer gh versions handle that transparently; older
      # ones reject an explicit merge method when a queue is active, hence the
      # method-less fallback.
      #
      # Token: MERGE_QUEUE_TOKEN (PAT/App-Token) ist Pflicht, damit der PR
      # tatsächlich in die Merge Queue eingereiht wird — der eingebaute
      # GITHUB_TOKEN kann das nicht (siehe Kopf-Kommentar). Ohne das Secret
      # greift der Fallback auf GITHUB_TOKEN; Auto-Merge wird dann zwar
      # aktiviert, der PR wandert aber nicht in die Queue. HAS_MQ_TOKEN spiegelt
      # nur wider, OB das Secret gesetzt ist (true/false) — es leakt keinen Wert.
      - name: Enable native auto-merge
        if: >-
          github.actor != 'dependabot[bot]' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_MQ_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$HAS_MQ_TOKEN" != "true" ]; then
            echo "::warning::MERGE_QUEUE_TOKEN ist nicht gesetzt — der eingebaute GITHUB_TOKEN kann den PR NICHT in die Merge Queue einreihen. Auto-Merge wird aktiviert, der PR bleibt aber offen. Siehe .github/repo-setup-checklist.md."
          fi
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --auto "$PR_URL"
