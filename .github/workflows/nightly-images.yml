name: Nightly Images

# Baut auf jedem Push auf main alle Docker-Images mit dem Tag :nightly und pusht
# sie nach GHCR. Damit funktioniert der Update-Kanal "Nightly" (Admin-Panel) auch
# bei image-basierten Installationen: Der Updater zieht im Nightly-Kanal die
# :nightly-Images statt :latest und folgt so jedem Commit auf main.
#
# Sicherheit: Jeder Commit auf main ist durch die Merge Queue gegen den
# aktuellen main getestet (Required Checks) — :nightly enthält also nie
# ungeprüften Code. :latest (Stable) und :beta (nummerierte Prereleases) bleiben
# davon unberührt und werden ausschließlich vom Release-Workflow gebaut
# (:latest aus einem vX.Y.Z-Tag, :beta aus einem vX.Y.Z-beta.N-Tag).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege pro Job: Schreibrechte stehen beim Job, nicht global.
permissions:
  contents: read

# Serialisieren statt canceln: Bei schnellen Merge-Wellen laufen die Builds
# nacheinander, jeder Stand ist in sich konsistent (kein Mix aus alten und
# neuen :nightly-Images durch einen mittendrin abgebrochenen Lauf).
concurrency:
  group: nightly-images
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push :nightly images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Nur fuer `cosign sign` (keyless, OIDC → Fulcio).
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # volle Historie + Tags für `git describe`

      - name: Determine app version
        id: appver
        run: |
          version="$(git describe --tags --always 2>/dev/null | sed 's/^v//')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${version}"

      # GHCR-Repositorynamen muessen klein geschrieben sein. metadata-action
      # macht das fuer seine Tags selbst; die cosign-Aufrufe unten brauchen den
      # Namen aber roh.
      - name: Repositoryname in Kleinbuchstaben
        id: repo
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action normalisiert den Repo-Namen auf Kleinbuchstaben
      # (GHCR-Pflicht) — deshalb nicht einfach ${{ github.repository }}:nightly.
      - name: Docker metadata – backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: type=raw,value=nightly

      - name: Docker metadata – frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: type=raw,value=nightly

      - name: Docker metadata – graphhopper
        id: meta-graphhopper
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/graphhopper
          tags: type=raw,value=nightly

      - name: Docker metadata – updater
        id: meta-updater
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/updater
          tags: type=raw,value=nightly

      - name: Docker metadata – osmium
        id: meta-osmium
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/osmium
          tags: type=raw,value=nightly

      # Base-Images stammen alle von Docker Hub und sind gelegentlich von
      # transienten Registry-Timeouts betroffen — vorab ziehen mit Retry
      # (gleiche Logik wie release.yml).
      - name: Pre-pull base images (resilient gegen Registry-Timeouts)
        run: |
          images=(
            "python:3.14-slim"
            "node:26-alpine"
            "eclipse-temurin:25-jre-alpine"
            "docker:cli"
            "debian:trixie-slim"
          )
          for image in "${images[@]}"; do
            n=0
            until docker pull "$image"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::Konnte $image nach $n Versuchen nicht ziehen"
                exit 1
              fi
              delay=$((2 ** n))
              echo "Pull von $image fehlgeschlagen (Versuch $n). Neuer Versuch in ${delay}s…"
              sleep "$delay"
            done
          done

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.version }}

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.version }}

      - name: Build and push graphhopper
        id: build-graphhopper
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./graphhopper
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-graphhopper.outputs.tags }}
          labels: ${{ steps.meta-graphhopper.outputs.labels }}

      - name: Build and push updater
        id: build-updater
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./docker/updater
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}

      - name: Build and push osmium
        id: build-osmium
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./docker/osmium
          push: true
          pull: false   # vorab gezogenes Base-Image aus dem lokalen Cache nutzen
          tags: ${{ steps.meta-osmium.outputs.tags }}
          labels: ${{ steps.meta-osmium.outputs.labels }}

      # ── Signatur (Sigstore/cosign, keyless) ─────────────────────────────
      # Ohne Signatur heisst "Image mit dem richtigen Tag" nur: irgendjemand
      # mit Schreibrecht auf GHCR hat es dort abgelegt. Der Updater auf jeder
      # Kundeninstallation zieht genau danach — und haelt dabei den nackten
      # Docker-Socket. Ein kompromittiertes Repo-Token waere damit Root auf
      # jeder Installation mit Auto-Update.
      #
      # Keyless: die Identitaet ist dieser Workflow (OIDC-Token von GitHub),
      # kein privater Schluessel liegt irgendwo herum. Signiert wird der
      # Digest, nicht der Tag — Tags sind beweglich, Digests nicht. Die
      # Signatur gilt damit fuer alle Tags, die auf denselben Digest zeigen.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          # GHCR verlangt Kleinbuchstaben; ${{ github.repository }} traegt sie
          # nicht zwingend. metadata-action normalisiert selbst, hier nicht.
          REPO_LC: ${{ steps.repo.outputs.lowercase }}
          DIGEST_BACKEND: ${{ steps.build-backend.outputs.digest }}
          DIGEST_FRONTEND: ${{ steps.build-frontend.outputs.digest }}
          DIGEST_GRAPHHOPPER: ${{ steps.build-graphhopper.outputs.digest }}
          DIGEST_UPDATER: ${{ steps.build-updater.outputs.digest }}
          DIGEST_OSMIUM: ${{ steps.build-osmium.outputs.digest }}
        run: |
          set -euo pipefail
          for entry in \
            "backend=${DIGEST_BACKEND}" \
            "frontend=${DIGEST_FRONTEND}" \
            "graphhopper=${DIGEST_GRAPHHOPPER}" \
            "updater=${DIGEST_UPDATER}" \
            "osmium=${DIGEST_OSMIUM}"
          do
            name="${entry%%=*}"
            digest="${entry#*=}"
            if [ -z "$digest" ]; then
              echo "::error::Kein Digest fuer $name — build-push-action hat keinen geliefert"
              exit 1
            fi
            echo "Signiere ghcr.io/${REPO_LC}/${name}@${digest}"
            cosign sign --yes "ghcr.io/${REPO_LC}/${name}@${digest}"
          done
