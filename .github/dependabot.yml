version: 2
# Labels: nur Labels verwenden, die im Repo tatsächlich existieren, sonst
# postet Dependabot auf jedem PR einen Fehlerkommentar ("labels could not be
# found") und der Label-Schritt schlägt teilweise fehl. "dependencies" und
# "auto-merge" existieren; Bereichs-Labels (backend/frontend/ci/docker) waren
# nicht angelegt und wurden daher entfernt. Wer sie nutzen möchte, legt sie
# vorher unter Issues/PRs → Labels an und trägt sie hier wieder ein.
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "auto-merge"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "auto-merge"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "auto-merge"
  - package-ecosystem: "docker"
    directory: "/graphhopper"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "auto-merge"
  - package-ecosystem: "docker"
    directory: "/docker/updater"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "auto-merge"
