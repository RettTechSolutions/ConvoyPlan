services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convoyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convoyplan}
      POSTGRES_DB: ${POSTGRES_DB:-convoyplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convoyplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/backend:latest}
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-convoyplan}:${POSTGRES_PASSWORD:-convoyplan}@db:5432/${POSTGRES_DB:-convoyplan}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      GRAPHHOPPER_URL: http://graphhopper:8989
      LICENSE_KEY: ${LICENSE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-RettTechSolutions/ConvoyPlan}
    volumes:
      - cert_uploads:/certs
      - logo_uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      graphhopper:
        condition: service_started

  graphhopper:
    image: ${GRAPHHOPPER_IMAGE:-ghcr.io/retttechsolutions/convoyplan/graphhopper:latest}
    restart: unless-stopped
    environment:
      OSM_DOWNLOAD_URL: ${OSM_DOWNLOAD_URL:-https://download.geofabrik.de/europe/germany-latest.osm.pbf}
      OSM_FILENAME: ${OSM_FILENAME:-germany-latest.osm.pbf}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx6g -Xms1g -XX:+UseG1GC}
    volumes:
      - osm_data:/data/osm
      - gh_graph:/data/graph
    ports:
      - "${GH_PORT:-8989}:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 240
      start_period: 120s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/retttechsolutions/convoyplan/frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-}
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
      - cert_uploads:/certs:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  osm_data:
  gh_graph:
  caddy_data:
  caddy_config:
  cert_uploads:
  logo_uploads:
