<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Datenfluss beim Live-Tracking: Fahrzeuge senden Position an den WebSocket-Hub, der sie live an alle Beteiligten verteilt">
  <rect x="0" y="0" width="960" height="360" rx="16" fill="#0f172a" stroke="#1f2b40"/>
  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="118" y="44" text-anchor="middle" fill="#7d8fab" font-size="12.5" font-weight="600" letter-spacing=".05em">FAHRZEUGE</text>
  <text x="480" y="44" text-anchor="middle" fill="#7d8fab" font-size="12.5" font-weight="600" letter-spacing=".05em">BACKEND</text>
  <text x="842" y="44" text-anchor="middle" fill="#7d8fab" font-size="12.5" font-weight="600" letter-spacing=".05em">ALLE BETEILIGTEN</text>

  <g font-size="13" font-weight="500">
    <rect x="34" y="74" width="168" height="52" rx="10" fill="#172033" stroke="#2b3a55"/>
    <circle cx="58" cy="100" r="5" fill="#22c55e"/><text x="74" y="104" fill="#e6ecf5">Florian 1/44/1</text>
    <rect x="34" y="152" width="168" height="52" rx="10" fill="#172033" stroke="#2b3a55"/>
    <circle cx="58" cy="178" r="5" fill="#22c55e"/><text x="74" y="182" fill="#e6ecf5">Florian 1/44/2</text>
    <rect x="34" y="230" width="168" height="52" rx="10" fill="#172033" stroke="#2b3a55"/>
    <circle cx="58" cy="256" r="5" fill="#22c55e"/><text x="74" y="260" fill="#e6ecf5">Florian 1/44/3</text>
  </g>
  <text x="118" y="312" text-anchor="middle" fill="#93a4bd" font-size="12">GPS aus dem Browser</text>

  <rect x="392" y="128" width="176" height="100" rx="14" fill="#172033" stroke="#3b82f6"/>
  <text x="480" y="166" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">WebSocket</text>
  <text x="480" y="188" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">Hub</text>
  <text x="480" y="210" text-anchor="middle" fill="#93a4bd" font-size="12">FastAPI · /ws/tracking</text>

  <g font-size="13" font-weight="500">
    <rect x="758" y="74" width="168" height="52" rx="10" fill="#172033" stroke="#2b3a55"/>
    <text x="842" y="104" text-anchor="middle" fill="#e6ecf5">Planer</text>
    <rect x="758" y="152" width="168" height="52" rx="10" fill="#172033" stroke="#2b3a55"/>
    <text x="842" y="182" text-anchor="middle" fill="#e6ecf5">Leitstelle</text>
    <rect x="758" y="230" width="168" height="52" rx="10" fill="#172033" stroke="#2b3a55"/>
    <text x="842" y="260" text-anchor="middle" fill="#e6ecf5">Beobachter · Share-Link</text>
  </g>
  <text x="842" y="312" text-anchor="middle" fill="#93a4bd" font-size="12">Live-Karte, ohne extra App</text>

  <g stroke="#22c55e" stroke-width="2" fill="none">
    <path d="M202,100 C300,100 300,168 386,168" marker-end="url(#arrG)"/>
    <path d="M202,178 C300,178 300,178 386,178" marker-end="url(#arrG)"/>
    <path d="M202,256 C300,256 300,188 386,188" marker-end="url(#arrG)"/>
  </g>
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M568,168 C660,168 660,100 752,100" marker-end="url(#arrB)"/>
    <path d="M568,178 C660,178 660,178 752,178" marker-end="url(#arrB)"/>
    <path d="M568,188 C660,188 660,256 752,256" marker-end="url(#arrB)"/>
  </g>
  <text x="290" y="150" fill="#7d8fab" font-size="11">Position</text>
  <text x="628" y="150" fill="#7d8fab" font-size="11">Broadcast</text>
</svg>
