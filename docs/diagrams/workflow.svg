<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="960" height="236" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Ablauf in vier Schritten: Route planen, Zeitplan, Marschbefehl, Live-Tracking">
  <rect x="0" y="0" width="960" height="236" rx="16" fill="#0f172a" stroke="#1f2b40"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="40" y="52" width="184" height="132" rx="14" fill="#172033" stroke="#2b3a55"/>
  <circle cx="132" cy="84" r="15" fill="#ef4444"/>
  <text x="132" y="89" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
  <text x="132" y="120" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="600">Route planen</text>
  <text x="132" y="144" text-anchor="middle" fill="#93a4bd" font-size="12.5">Wegpunkte setzen,</text>
  <text x="132" y="161" text-anchor="middle" fill="#93a4bd" font-size="12.5">GraphHopper berechnet</text>
  <text x="132" y="178" text-anchor="middle" fill="#93a4bd" font-size="12.5">die Route</text>

  <!-- Step 2 -->
  <rect x="272" y="52" width="184" height="132" rx="14" fill="#172033" stroke="#2b3a55"/>
  <circle cx="364" cy="84" r="15" fill="#ef4444"/>
  <text x="364" y="89" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
  <text x="364" y="120" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="600">Zeitplan</text>
  <text x="364" y="144" text-anchor="middle" fill="#93a4bd" font-size="12.5">Startzeit, Tempo &amp;</text>
  <text x="364" y="161" text-anchor="middle" fill="#93a4bd" font-size="12.5">Halte → Ankunfts-</text>
  <text x="364" y="178" text-anchor="middle" fill="#93a4bd" font-size="12.5">zeiten automatisch</text>

  <!-- Step 3 -->
  <rect x="504" y="52" width="184" height="132" rx="14" fill="#172033" stroke="#2b3a55"/>
  <circle cx="596" cy="84" r="15" fill="#ef4444"/>
  <text x="596" y="89" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
  <text x="596" y="120" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="600">Marschbefehl</text>
  <text x="596" y="144" text-anchor="middle" fill="#93a4bd" font-size="12.5">Export als</text>
  <text x="596" y="161" text-anchor="middle" fill="#93a4bd" font-size="12.5">PDF · GPX · JSON</text>

  <!-- Step 4 -->
  <rect x="736" y="52" width="184" height="132" rx="14" fill="#172033" stroke="#22c55e"/>
  <circle cx="828" cy="84" r="15" fill="#22c55e"/>
  <text x="828" y="89" text-anchor="middle" fill="#0b1220" font-size="14" font-weight="700">4</text>
  <text x="828" y="120" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="600">Live-Tracking</text>
  <text x="828" y="144" text-anchor="middle" fill="#93a4bd" font-size="12.5">Fahrzeuge senden</text>
  <text x="828" y="161" text-anchor="middle" fill="#93a4bd" font-size="12.5">Position, alle sehen</text>
  <text x="828" y="178" text-anchor="middle" fill="#93a4bd" font-size="12.5">den Stand live</text>

  <g stroke="#ef4444" stroke-width="2.5" fill="none">
    <line x1="228" y1="118" x2="266" y2="118" marker-end="url(#arr)"/>
    <line x1="460" y1="118" x2="498" y2="118" marker-end="url(#arr)"/>
    <line x1="692" y1="118" x2="730" y2="118" marker-end="url(#arr)"/>
  </g>
</svg>
